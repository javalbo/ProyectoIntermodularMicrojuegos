@startuml casos-de-uso
' Diagrama de casos de uso de Planeta en Juego (Actividad 1)
' Para regenerarlo: java -jar plantuml.jar -tsvg casos-de-uso.puml
left to right direction
skinparam shadowing false
skinparam defaultFontName Arial
skinparam defaultFontSize 14
skinparam actor {
  BorderColor #1C1E3D
  BackgroundColor #FFF6DD
}
skinparam usecase {
  BackgroundColor #FFFDF5
  BorderColor #1C1E3D
  ArrowColor #1C1E3D
}
skinparam rectangle {
  BorderColor #1F5FBF
  BackgroundColor #FFFFFF
}

actor "Jugador" as J

rectangle "Planeta en Juego (página web + juego)" {
  usecase "Iniciar partida" as UC1
  usecase "Jugar microjuego" as UC2
  usecase "Consultar puntuación" as UC3
  usecase "Volver al menú" as UC4
  usecase "Consultar documentación" as UC5
}

J - -> UC1
J - -> UC2
J - -> UC3
J - -> UC4
J - -> UC5
UC1 .> UC2 : <<include>>
@enduml

